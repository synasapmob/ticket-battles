on:
  push:
    branches:
      - main
      
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        id: build
        run: |
          npm install
          npm install vercel

  # deploy vercel  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Build Project
        run: vercel build

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_lFYyt02gQqNjxoIvpEGG8IAi
          VERCEL_PROJECT_ID: prj_SE4gdpf6f6TBuakFVFBIgHT7qhQt